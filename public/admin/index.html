<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FAM Admin Dashboard</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body class="admin-body">
  <aside class="sidebar">
    <div class="sidebar-brand">FAM<span>Admin</span></div>
    <nav class="nav" id="navList">
      <button class="nav-btn active" data-view="dashboard">Dashboard</button>
      <button class="nav-btn" data-view="availability">Availability</button>
      <button class="nav-btn" data-view="reservations">Reservations</button>
      <button class="nav-btn" data-view="rooms">Rooms</button>
    </nav>
    <div class="sidebar-foot">
      <span id="adminName"></span>
      <button class="nav-btn nav-btn-outline" id="logoutBtn">Log out</button>
    </div>
  </aside>

  <main class="content">
    <header class="topbar">
      <button class="btn btn-ghost" id="backBtn">← Back to site</button>
      <h1 class="page-title" id="pageTitle">Dashboard</h1>
    </header>
    <div id="views"></div>
  </main>

  <div id="modalRoot"></div>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/availability.js"></script>
  <script src="js/reservations.js"></script>
  <script src="js/rooms.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
